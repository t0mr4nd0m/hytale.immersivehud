plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gradleup.shadow' version '9.3.1'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.internal.os.OperatingSystem

String hytaleHomePath = null
if (project.hasProperty('hytale_home')) {
    hytaleHomePath = project.findProperty('hytale_home')?.toString()
} else if (System.getenv('HYTALE_HOME')) {
    hytaleHomePath = System.getenv('HYTALE_HOME')
} else {
    def os = OperatingSystem.current()
    String userHomePath = System.getProperty('user.home')
    if (os.isWindows()) {
        hytaleHomePath = new File(userHomePath, 'AppData/Roaming/Hytale').path
    } else if (os.isMacOsX()) {
        hytaleHomePath = new File(userHomePath, 'Library/Application Support/Hytale').path
    } else if (os.isLinux()) {
        hytaleHomePath = new File(userHomePath, '.var/app/com.hypixel.HytaleLauncher/data/Hytale').path
        if (!file(hytaleHomePath).exists()) {
            hytaleHomePath = new File(userHomePath, '.local/share/Hytale').path
        }
    }
}

if (hytaleHomePath != null) {
    ext.set('hytaleHome', hytaleHomePath)
}
def hasHytaleHome = (hytaleHomePath != null) && file(hytaleHomePath).exists()
if (!hasHytaleHome) {
    logger.lifecycle("Hytale install not detected; run configs that launch the server will be skipped. Set -Phytale_home=/path/to/Hytale to enable them.")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Quiet warnings about missing Javadocs.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// Adds the Hytale server as a build dependency, allowing you to reference and
// compile against their code without bundling it. When a local install is
// present, we still use its jar for launching the server in IDE run configs.
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly("com.hypixel.hytale:Server:$hytale_build")
    testImplementation("com.hypixel.hytale:Server:$hytale_build")

    // DO NOT add the local HytaleServer.jar as a runtime dependency.
    // ShadowJar will include it and your plugin jar becomes massive.
}

// Standalone regression checks using the same interaction walker as the server.
tasks.register('verifyWeaponClassification', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.runtime.signal.WeaponBehaviorClassifierTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.named('check') {
    dependsOn 'verifyWeaponClassification'
    dependsOn 'verifyConfigPause'
    dependsOn 'verifyDetectorSelection'
    dependsOn 'verifyRuleQueries'
    dependsOn 'verifyProfileModels'
    dependsOn 'verifyConfigPersistence'
    dependsOn 'verifyHudTimers'
    dependsOn 'verifyCombatScanning'
}

tasks.register('verifyCombatScanning', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.runtime.signal.CombatScanTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.register('verifyHudTimers', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.runtime.HudTimersTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.register('verifyConfigPersistence', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.config.ConfigPersistenceTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.register('verifyProfileModels', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.profiles.ProfilePresetsTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.register('verifyRuleQueries', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.config.DynamicHudRuleConfigTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.register('verifyDetectorSelection', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.runtime.HudDetectionPlanTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.register('verifyConfigPause', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tom.immersivehudplugin.ui.HudConfigPauseControllerTest'
    workingDir = layout.buildDirectory.get().asFile
}

tasks.named('test') {
    // The regression suite above is a standalone runner, rather than JUnit tests.
    failOnNoDiscoveredTests = false
}

repositories {
    mavenCentral()
    maven {
        name = "hytale-release"
        url = uri("https://maven.hytale.com/release")
    }
    maven {
        name = "hytale-pre-release"
        url = uri("https://maven.hytale.com/pre-release")
    }
}

// Updates the manifest.json file with the latest properties defined in the
// build.properties file. Currently we update the version and if packs are
// included with the plugin.
tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }
        def manifestJson = new JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.ServerVersion = hytale_build_supported
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestJson))
    }
}

// Makes sure the plugin manifest is up to date.
tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}

tasks.named('shadowJar') {
    archiveBaseName.set("ImmersiveHud")
    archiveClassifier.set('')
    mergeServiceFiles()
    minimize()

    // Only shade runtimeClasspath (default, but explicit = safer)
    configurations = [project.configurations.runtimeClasspath]
}

// Ensure the shaded jar is produced during a normal build.
tasks.named('build') {
    dependsOn 'shadowJar'
}

if (hasHytaleHome) {
    // do nothing
} else {
    tasks.register('generateVSCodeLaunch') {
        doLast {
            logger.lifecycle("Skipped VSCode launch configuration because hytale_home is not set or the install path is missing.")
        }
    }
}

